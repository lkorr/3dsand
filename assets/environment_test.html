<!doctype html>
<!-- Headless harness for the Environment tab. Loaded by
     scripts/check_environment.sh through Chrome; it prints PASS/FAIL lines
     into #out for --dump-dom.

     WHAT IT COVERS THAT `node scripts/test_environment.mjs` DOES NOT. The Node
     test asserts the DATA: watergen determinism, preset sanity, every biome
     file valid, no species weight mirror, the swatch composing. What cannot
     be asserted from Node is whether the TAB MOUNTS: the sidebar, page
     switching, the three page modules building their panels, WorldView
     meshing a water body and a biome swatch, anything reaching the
     framebuffer, the plan/profile canvases painting, the deep links between
     pages, and the save routes accepting biomes/ and water/ files. Every one
     of those can break without touching a line of the generators.

     IT DRIVES THE MODULE DIRECTLY rather than iframing tuner.html (an iframe
     under --virtual-time-budget does not reliably reach `complete`), and
     checks the tuner's wiring by regex against GET / — the same arrangement
     as trees_test.html, for the same reasons.

     NEEDS NO BUILT EXE: the one engine call (the map page's Load check,
     `sandvox --mapcheck`) is asserted only when the exe answers; without one
     the panel says so and the line says "engine unavailable". -->
<meta charset="utf-8">
<title>environment harness</title>
<body style="background:#111;color:#ddd;font:12px monospace">
<div id="host" style="width:1200px;height:700px;display:flex"></div>
<pre id="out">running</pre>
<script src="worldview.js"></script>
<script type="module">
var log = [], fail = 0;
// Progress lands in #out as it happens, so a run that exhausts the virtual
// time budget still says how far it got (the last line is where it stalled).
function say(ok, msg){ log.push((ok?'PASS  ':'FAIL  ') + msg); if(!ok) fail++; document.getElementById('out').textContent = 'running' + String.fromCharCode(10) + log.join(String.fromCharCode(10)); }
function done(){
  document.getElementById('out').textContent =
    log.join('\n') + '\n\nRESULT ' + (fail ? ('FAIL(' + fail + ')') : 'OK');
  document.title = fail ? 'FAIL' : 'OK';
}
// THE POLL IS A FETCH, DELIBERATELY: --virtual-time-budget fast-forwards
// setTimeout to zero but pauses on network. (See trees_test.html.)
async function waitFor(pred, ms){
  var t0 = performance.now();
  while (performance.now() - t0 < (ms || 40000)) {
    try { if (pred()) return true; } catch (e) {}
    await fetch('/api/status').catch(function(){});
  }
  return false;
}
function readLit(wv, cv){
  wv.render();
  var px = new Uint8Array(cv.width * cv.height * 4);
  wv.gl.readPixels(0, 0, cv.width, cv.height, wv.gl.RGBA, wv.gl.UNSIGNED_BYTE, px);
  var lit = 0;
  for (var i = 0; i < px.length; i += 4) if (px[i] > 26 || px[i+1] > 30 || px[i+2] > 36) lit++;
  return {lit: lit, tot: px.length / 4, quads: wv.stats.quads};
}

(async function(){
  try {
    say(typeof WorldView === 'function', 'worldview.js loaded');

    // ---- 1. tuner.html is wired to the module --------------------------------
    var page = await (await fetch('/', {cache: 'no-store'})).text();
    [['nav button',      /data-tab="environment"/],
     ['section',         /id="view-environment"/],
     ['tab allowlist',   /\[[^\]]*'environment'[^\]]*\]\.includes\(activeTab\)/],
     ['renderAll hook',  /activeTab==='environment'\)\{envActivate/],
     ['host bridge',     /__tunerRegisterEnv/],
     ['tuning hook',     /tuning:\(\)=>\(\{schema/],
     ['module import',   /editor\/environment\.js/]
    ].forEach(function (w) { say(w[1].test(page), 'tuner.html has the ' + w[0]); });
    say(!/data-tab="trees"/.test(page), 'the old top-level Trees button is gone (trees is a page now)');

    // ---- 2. mount ------------------------------------------------------------------------------------
    var files = await (await fetch('/api/files', {cache: 'no-store'})).json();
    var mats = JSON.parse(files.materials).materials;
    say(mats.length > 50, 'materials.json: ' + mats.length + ' materials');
    var tune = null;
    try { tune = JSON.parse(files.tuning); } catch (e) {}
    say(!!(tune && tune.world && !tune.worldgen), 'tuning.json loaded (world group present, no worldgen group: P-G/P-I)');

    var toasts = [];
    var host = document.getElementById('host');
    host.id = 'view-environment';
    host.className = 'view active';
    var hooks = {
      el: function (tag, attrs) {
        var e = document.createElement(tag);
        for (var k in (attrs || {})) {
          if (k === 'class') e.className = attrs[k];
          else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
          else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
        }
        for (var i = 2; i < arguments.length; i++) {
          var c = arguments[i];
          if (c == null) continue;
          if (Array.isArray(c)) { c.forEach(function (x) { if (x != null) e.append(x.nodeType ? x : document.createTextNode(String(x))); }); continue; }
          e.append(c.nodeType ? c : document.createTextNode(String(c)));
        }
        return e;
      },
      toast: function (m, bad) { toasts.push((bad ? 'ERR ' : '') + m); },
      materials: function () { return mats; },
      onDirty: function () {},
      section: host,
      // The knob pages and the band strip take the tuner's tuning plumbing;
      // the harness has tune but no tuneRow, so they must DEGRADE, not throw.
      tuning: function () { return {schema: null, tune: tune, tuneBase: tune, tuneRow: null, paramGroup: null, touchTune: function(){}}; },
      voxelsPerMetre: function () { return 10; },
      saveTuning: function () {}
    };
    var E = await import('./editor/environment.js');
    E.attach(hooks);
    var pages = E._pages();
    say(!!pages.map && !!pages.biome && !!pages.trees && !!pages.water && !pages.caves && !pages.cover,
        'four pages mounted: map, biome, trees, water (the caves / cover knob pages went with the worldgen group)');
    say(pages.trees.id === 'view-trees' && !pages.trees.classList.contains('view'),
        'trees page is #view-trees WITHOUT class "view" (check_tabs.sh would count it otherwise)');
    E.activate();
    var nav = host.querySelector('.envnav');
    var ok = await waitFor(function(){ return nav.querySelectorAll('button[data-page="biome"][data-name]').length >= 4; });
    var biomeBtns = nav.querySelectorAll('button[data-page="biome"][data-name]');
    say(ok, 'sidebar lists ' + biomeBtns.length + ' biomes from /api/models');
    ok = await waitFor(function(){ return !/unsaved biome/.test(nav.textContent); }, 20000);
    say(ok, 'no "(unsaved biome)" placeholder while the first biome is merely loading');
    say(nav.querySelectorAll('button[data-page]').length >= 6, 'and the map + two component pages');

    // ---- 3. the biome page --------------------------------------------------------------------------
    // Since the World map page (P3) the tab opens on the map, so the biome
    // page is deep-linked here the way the sidebar does it.
    var B = E._modules.Biome;
    await E._open('biome', 'forest');
    ok = await waitFor(function(){ return !!B._biome() && B.currentName() === 'forest'; });
    say(ok, 'biome page loaded forest: ' + (B._biome() && B._biome().displayName));
    var bstats = pages.biome.querySelector('.bmstats');
    // The swatch is the ENGINE's since map-overhaul P7 (--voxserve SWATCH), so
    // this needs the built exe; the stats line is the engine's sample census.
    ok = await waitFor(function(){ return /as the ENGINE generates it/.test(bstats.textContent); }, 180000);
    say(ok, 'swatch rendered by the engine: ' + bstats.textContent.replace(/\s+/g, ' ').slice(0, 200));
    say(/(wood|leaves|leaf_|bark)/.test(bstats.textContent), 'the engine swatch holds tree matter (a forest grows trees)');
    var valid = pages.biome.querySelector('.bmvalid');
    say(/valid/.test(valid.textContent), 'forest validates: ' + valid.textContent.slice(0, 80));
    var stackRows = pages.biome.querySelectorAll('.bmstackrow').length;
    say(stackRows >= 10, 'feature stacks built ' + stackRows + ' rows (cover + trees + water + caves)');
    say(!pages.biome.querySelector('.bmband'), 'no biome band strip: the noise thresholds are gone with the worldgen group (P-G)');
    var curve = pages.biome.querySelector('canvas.bmcurve');
    say(!!curve && !curve.parentNode.classList.contains('bmdead'), 'the relief curve canvas is built and live (terrain.curve)');
    var hillRow = rowOf(pages.biome, 'bm', 'hills \u00d7');
    say(!!hillRow && !hillRow.classList.contains('bmdead') && !hillRow.querySelector('.bmlivepill'), 'terrain.hill renders live');
    // ---- 3b. honest pages (PLAN_environment_truth P-B) ---------------------------------------------
    // Unread fields render disabled with the package in a pill; live ones do not.
    function rowOf(page, cls, label) {
      var hit = null;
      page.querySelectorAll('.' + cls + 'row > label').forEach(function (l) { if (l.firstChild && l.firstChild.textContent === label) hit = l.parentNode; });
      return hit;
    }
    var tileRow = rowOf(pages.biome, 'bm', 'tile (m)'), densRow = rowOf(pages.biome, 'bm', 'density (%)');
    say(!!tileRow && !tileRow.classList.contains('bmdead') && !tileRow.querySelector('input').disabled,
        'trees.tile renders live (P-D: one lattice, thinned per biome)');
    say(!!densRow && !densRow.classList.contains('bmdead') && !densRow.querySelector('input').disabled && !densRow.querySelector('.bmlivepill'),
        'trees.density renders live (no pill, enabled)');
    var dstat = null;
    pages.biome.querySelectorAll('.bmderived').forEach(function (d) { if (/trees per hectare/.test(d.textContent)) dstat = dstat || d; });
    say(!!dstat && /trees per hectare/.test(dstat.textContent),
        'the density stat: ' + (dstat && dstat.textContent.slice(0, 90)));
    var covRow = rowOf(pages.biome, 'bm', 'ground flora blocks'), cacRow = rowOf(pages.biome, 'bm', 'cactus 1-in-N');
    say(!!covRow && !covRow.classList.contains('bmdead') && !!cacRow && !cacRow.classList.contains('bmdead'),
        'the packed flags and cactusChance are live rows');
    say(pages.biome.querySelectorAll('.bmlive-unknown').length === 0, 'no field on the biome page is outside the manifest');
    // A LIVE slider regenerates and coalesces into one undo step (the drag test
    // lived on the water page until every water field became not-read).
    var bdepth0 = B._undoDepth();
    var bbefore = bstats.textContent;
    var brng = densRow.querySelector('.bmrng');
    var bv0 = brng.value;
    for (var bd = 0; bd < 6; bd++) {
      brng.value = String(Math.max(parseFloat(brng.min), parseFloat(brng.value) - parseFloat(brng.step)));
      brng.dispatchEvent(new Event('input', {bubbles: true}));
    }
    ok = await waitFor(function(){ return bstats.textContent !== bbefore && /as the ENGINE generates it/.test(bstats.textContent); }, 180000);
    say(ok && brng.value !== bv0, 'a six-step density drag recomposed the swatch (' + bv0 + ' -> ' + brng.value + ')');
    say(B._undoDepth() === bdepth0 + 1, 'and cost exactly one undo step (' + (B._undoDepth() - bdepth0) + ')');
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'z', ctrlKey: true, bubbles: true}));
    ok = await waitFor(function(){ return B._undoDepth() === bdepth0 && brng.value === bv0; }, 20000);
    say(ok, 'Ctrl+Z put the density back (' + brng.value + ')');
    var wvB = B._view();
    var lb = null;
    ok = await waitFor(function(){ lb = readLit(wvB, pages.biome.querySelector('canvas.bmview')); return lb.quads > 100 && lb.lit > lb.tot * 0.01; }, 60000);
    say(ok, 'biome swatch reaches the framebuffer: ' + (lb && lb.quads.toLocaleString()) + ' quads, ' +
        (lb && (100 * lb.lit / lb.tot).toFixed(1)) + '% lit');

    // stack edit + undo: add a species row, then Ctrl+Z removes it.
    var nSpecies = B._biome().trees.species.length;
    var addBtn = null;
    pages.biome.querySelectorAll('button').forEach(function (b) { if (b.textContent === '+ species') addBtn = b; });
    say(!!addBtn, 'the trees stack has an add button');
    var depth0 = B._undoDepth();
    addBtn.click();
    say(B._biome().trees.species.length === nSpecies + 1, 'adding a species row grew the stack to ' + B._biome().trees.species.length);
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'z', ctrlKey: true, bubbles: true}));
    ok = await waitFor(function(){ return B._biome().trees.species.length === nSpecies && B._undoDepth() === depth0; }, 20000);
    say(ok, 'Ctrl+Z removed it again (' + B._biome().trees.species.length + ' rows, undo depth ' + B._undoDepth() + ')');

    // ---- 4. the water page ----------------------------------------------------------------------------
    var W = E._modules.Water;
    await E._open('water', 'kettle');
    say(pages.water.classList.contains('active') && !pages.biome.classList.contains('active'),
        'deep link switched to the water page');
    ok = await waitFor(function(){ return W.currentName() === 'kettle' && !!W._last(); }, 60000);
    say(ok, 'water page opened the kettle preset');
    var wstats = pages.water.querySelector('.wbstats');
    ok = await waitFor(function(){ return /volume/.test(wstats.textContent); }, 60000);
    say(ok, 'water body generated: ' + wstats.textContent.replace(/\s+/g, ' ').slice(0, 150));
    say(!/CLIPPED|materials\.json has no/.test(wstats.textContent), 'no clipping, every material resolves');
    var wrows = pages.water.querySelectorAll('.wbrow').length;
    say(wrows > 45, 'built ' + wrows + ' parameter rows');
    var wvW = W._view();
    var lw = null;
    ok = await waitFor(function(){ lw = readLit(wvW, pages.water.querySelector('canvas.wbview')); return lw.quads > 100 && lw.lit > lw.tot * 0.01; }, 60000);
    say(ok, 'water body reaches the framebuffer: ' + (lw && lw.quads.toLocaleString()) + ' quads, ' +
        (lw && (100 * lw.lit / lw.tot).toFixed(1)) + '% lit');
    // The liquid actually rendered: WorldView's fluid layer counts liquid faces.
    var last = W._last();
    say(last.meta.waterCells > 1000 && last.meta.wet, 'the kettle holds water: ' + last.meta.waterCells + ' cells, Vd ' + last.meta.volumeDevelopment.toFixed(2));
    // Plan + profile canvases painted (not all one colour).
    function painted(cv) {
      var g = cv.getContext('2d'); var d = g.getImageData(0, 0, cv.width, cv.height).data;
      var s = new Set(); for (var i = 0; i < d.length; i += 4 * 97) s.add(d[i] << 16 | d[i+1] << 8 | d[i+2]);
      return s.size;
    }
    say(painted(pages.water.querySelector('canvas.wbplan')) > 5, 'plan canvas painted (' + painted(pages.water.querySelector('canvas.wbplan')) + ' colours sampled)');
    say(painted(pages.water.querySelector('canvas.wbprofile')) > 3, 'profile canvas painted');
    // Honest pages: since P-E (the flora) and P-F (the geometry) a preset's
    // rows are LIVE; what stays disabled is the shaped footprint, the floor
    // noise, the per-preset ground and the level, each with 'later' in its
    // pill. The manifest (envlive.js) is the switch.
    var wr = pages.water.querySelectorAll('.wbrow');
    var wdead = 0, wlater = 0, wlive = 0;
    wr.forEach(function (r) {
      var p = r.querySelector('.wblivepill');
      if (r.classList.contains('wbdead')) { wdead++; if (p && p.textContent === 'later') wlater++; }
      else if (!r.classList.contains('wbpreview')) wlive++;
    });
    say(wlive > 30 && wdead > 10 && wlater === wdead, 'water rows: ' + wlive + ' live, ' + wdead + ' disabled (all ' + wlater + ' of them later)');
    var radRow = rowOf(pages.water, 'wb', 'radius (m)');
    say(!!radRow && !radRow.querySelector('.wbrng').disabled && !radRow.querySelector('.wbnum').disabled, 'the radius slider and box are live (P-F)');
    say(pages.water.querySelectorAll('.wblive-unknown').length === 0, 'no field on the water page is outside the manifest');
    var plantIn = pages.water.querySelector('.wbplant input');
    say(!!plantIn && !plantIn.disabled, 'shore plant rows are live (P-E)');
    var prof = pages.water.querySelector('canvas.wbprofile');
    var nPts = W._params().bathymetry.profile.length;
    var r = prof.getBoundingClientRect();
    prof.dispatchEvent(new MouseEvent('mousedown', {button: 0, clientX: r.left + r.width * 0.4, clientY: r.top + r.height * 0.4, bubbles: true}));
    window.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
    await new Promise(function (res) { setTimeout(res, 300); });
    say(!prof.classList.contains('wbdead') && W._params().bathymetry.profile.length === nPts + 1,
        'the profile canvas is live and a click adds a point (' + nPts + ' -> ' + W._params().bathymetry.profile.length + ')');

    // ---- 5. the trees page still works inside the shell ------------------------------------------------
    var T = E._modules.Trees;
    await E._open('trees', 'oak');
    say(pages.trees.classList.contains('active'), 'deep link switched to the trees page');
    var tstats = pages.trees.querySelector('.tgstats');
    ok = await waitFor(function(){ return /voxels/.test(tstats.textContent) && T.currentName() === 'oak'; }, 90000);
    say(ok, 'trees page generated oak inside the Environment tab: ' + tstats.textContent.replace(/\s+/g, ' ').slice(0, 90));
    var weightRow = null;
    pages.trees.querySelectorAll('.tgrow label').forEach(function (l) { if (l.textContent === 'biome weights') weightRow = l.parentNode; });
    // The per-species weight mirror is gone (weights live only in the biome
    // files): no weights row, and the Placement section links to the owner.
    var ownerLink = null;
    pages.trees.querySelectorAll('a.tghint').forEach(function (a) { if (/biome pages/.test(a.textContent)) ownerLink = a; });
    say(!weightRow && !!ownerLink, 'species placement shows no weight mirror and links to the biome pages' +
        (weightRow ? ': found ' + weightRow.textContent.slice(0, 60) : ''));

    // ---- 6. the World map page: the front door (P-I) ----------------------------------------------------------
    E._open('map');
    var M = E._modules.WorldMap;
    ok = await waitFor(function(){ return !!M._map(); }, 30000);
    say(ok && pages.map.classList.contains('active'), 'map page loaded ' + (M._map() && M._map().name));
    say(!!pages.map.querySelector('.mapterrain') && pages.map.querySelectorAll('.mapterrain-grid input').length >= 20,
        'Terrain section built with ' + pages.map.querySelectorAll('.mapterrain-grid input').length + ' inputs');
    var siteRows = pages.map.querySelectorAll('.mapsite');
    say(siteRows.length >= 4, 'Sites panel lists ' + siteRows.length + ' sites');
    var lf = [].slice.call(siteRows).filter(function (r) { return /landform/.test(r.querySelector('.mapkind').textContent); });
    say(lf.length >= 1, 'a landform site is listed (' + lf.length + ')');
    if (lf.length) {
      lf[0].querySelector('button').click();
      say(M._selected() && M._selected().kind === 'landform' && !!pages.map.querySelector('.mapsites-panel select'),
          'selecting it opens the shape / radius / height panel');
    }
    // ---- 6b. the map page's TOOLS, driven with pointer events (P5 sculpt, P6 tree / load check) ----------------
    // Nothing is saved: every change is undone, so no file moves.
    var btns = [].slice.call(pages.map.querySelectorAll('.mapbar button')).map(function (b) { return b.textContent; });
    say(btns.indexOf('Landform brush') >= 0 && btns.indexOf('Landform site') >= 0 && btns.indexOf('Tree') >= 0 && btns.indexOf('Sculpt') >= 0,
        'the toolbar carries Landform brush AND Landform site, Tree and Sculpt (' + btns.length + ' buttons)');
    var cv = pages.map.querySelector('canvas.mapcanvas');
    cv.setPointerCapture = function () {};   // a synthetic pointer has no capture to take
    function ptr(type, fx, fy, extra) {
      var r = cv.getBoundingClientRect();
      var o = {clientX: r.left + r.width * fx, clientY: r.top + r.height * fy, button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerId: 7, bubbles: true};
      for (var k in (extra || {})) o[k] = extra[k];
      cv.dispatchEvent(new PointerEvent(type, o));
    }
    say(cv.clientWidth > 100 && cv.clientHeight > 100, 'map canvas laid out ' + cv.clientWidth + 'x' + cv.clientHeight);
    // SCULPT: a raise stroke writes the layer, one undo step, Undo takes it back.
    var S = M._sculpt(), u0 = M._undoDepth(), tiles0 = S.tiles.size;
    M._tool('sculpt');
    S.mode = 'raise'; S.radius = 2048; S.strength = 50;
    ptr('pointerdown', 0.5, 0.5); ptr('pointermove', 0.55, 0.5); ptr('pointermove', 0.6, 0.52); ptr('pointerup', 0.6, 0.52);
    var peak = 0;
    S.tiles.forEach(function (t) { for (var i = 0; i < t.length; i++) peak = Math.max(peak, t[i]); });
    say(S.tiles.size > tiles0 && peak > 1 && S.dirty && M._undoDepth() === u0 + 1,
        'a sculpt raise stroke wrote ' + (S.tiles.size - tiles0) + ' tiles, peak +' + peak.toFixed(1) + ' vox, ' + (M._undoDepth() - u0) + ' undo step');
    var bytes = M.serializeSculpt(S.tiles), back2 = bytes ? M.parseSculpt(bytes.buffer) : new Map();
    var same = bytes && back2.size <= S.tiles.size && back2.size > 0;
    back2.forEach(function (t, k) { var a = S.tiles.get(k); if (!a) { same = false; return; } for (var i = 0; i < t.length; i++) if (t[i] !== Math.round(a[i])) same = false; });
    say(!!same, 'the stroke serialises and parses back to the rounded layer (' + (bytes ? bytes.length : 0) + ' bytes, ' + back2.size + ' tiles)');
    [].slice.call(pages.map.querySelectorAll('.mapbar button')).filter(function (b) { return b.textContent === 'Undo'; })[0].click();
    var left = 0;
    S.tiles.forEach(function (t) { for (var i = 0; i < t.length; i++) left = Math.max(left, Math.abs(t[i])); });
    say(S.tiles.size === tiles0 && left === 0 && M._undoDepth() === u0, 'Undo takes the stroke back (' + S.tiles.size + ' tiles, max |offset| ' + left + ')');
    // TREE: a click plants the picked species at the column, the Sites panel edits it; Undo removes it.
    ok = await waitFor(function(){ return M._trees().list.length > 0; }, 10000);
    say(ok, 'tree species listed from assets/trees/*.svtree: ' + M._trees().list.join(', '));
    var nSites = M._map().json.sites.length;
    M._tool('tree');
    ptr('pointerdown', 0.3, 0.4); ptr('pointerup', 0.3, 0.4);
    var ts = M._map().json.sites[M._map().json.sites.length - 1];
    say(M._map().json.sites.length === nSites + 1 && ts.kind === 'tree' && ts.species === M._trees().species &&
        Array.isArray(ts.at) && ts.variant === undefined && ts.rot === undefined,
        'the Tree tool planted ' + JSON.stringify(ts));
    say(M._selected() === ts && !!pages.map.querySelector('.mapsites-panel select') &&
        [].slice.call(pages.map.querySelectorAll('.mapsite .mapkind')).some(function (k) { return k.textContent === 'tree'; }),
        'the new tree is selected, listed, and its panel has the species select');
    [].slice.call(pages.map.querySelectorAll('.mapbar button')).filter(function (b) { return b.textContent === 'Undo'; })[0].click();
    say(M._map().json.sites.length === nSites, 'Undo removes it (' + M._map().json.sites.length + ' sites)');
    // LOAD CHECK: the panel asked the engine (or says why it could not).
    ok = await waitFor(function(){ return !!M._check(); }, 60000);
    var ck = M._check();
    say(ok && !!pages.map.querySelector('.mapcheck'), 'Load check panel: ' + (ck ? (ck.unavailable ? 'engine unavailable (' + String(ck.error).slice(0, 60) + ')' :
        (ck.ok ? (ck.warnings || []).length + ' warnings' : 'REFUSED: ' + ck.error)) : 'no answer'));
    say(!ck || ck.unavailable || ck.ok, 'the engine loads the ' + M._map().name + ' map');
    M._tool('biome');

    // The preview host lives in tuner.html; this harness drives the module
    // alone, so only the wiring is checked here: tuner.html carries the host
    // and the map page's adoption code.
    say(/id="wgPreviewHost"/.test(page) && /wgPreviewShow/.test(page), 'tuner.html carries the preview host the map page adopts');

    // ---- 7. hidden tab -> no active page ------------------------------------------------------------------------
    host.classList.remove('active');
    ok = await waitFor(function(){ return !Object.values(pages).some(function (p) { return p.classList.contains('active'); }); }, 5000);
    say(ok, 'deactivating the tab deactivates every page (render loops go quiet)');
    host.classList.add('active');
    ok = await waitFor(function(){ return pages.map.classList.contains('active'); }, 5000);
    say(ok, 'reactivating restores the current page');

    // ---- 8. save routes for the two new directories -----------------------------------------------------------
    var src = await (await fetch('/api/model?path=biomes/forest.json', {cache:'no-store'})).text();
    var w = await (await fetch('/api/model?path=biomes/_harness.json', {method:'POST', body: src})).json();
    say(!!w.ok, 'POST biomes/_harness.json -> ' + JSON.stringify(w).slice(0, 80));
    var back = await (await fetch('/api/model?path=biomes/_harness.json', {cache:'no-store'})).text();
    say(back === src, 'biome .json round-tripped byte-for-byte (' + back.length + ' bytes)');
    var wsrc = await (await fetch('/api/model?path=water/tarn.json', {cache:'no-store'})).text();
    w = await (await fetch('/api/model?path=water/_harness.json', {method:'POST', body: wsrc})).json();
    say(!!w.ok, 'POST water/_harness.json -> ' + JSON.stringify(w).slice(0, 80));
    var badj = await (await fetch('/api/model?path=water/_harness.json', {method:'POST', body: '{not json'})).json();
    say(badj.ok === false, 'a non-JSON body is refused: ' + (badj.error || '(ACCEPTED)'));
    var esc = await (await fetch('/api/model?path=biomes/../materials/tuning.json', {method:'POST', body: '{}'})).json();
    say(esc.ok === false, 'a traversal out of biomes/ is refused');
    say(toasts.filter(function (t) { return /^ERR/.test(t); }).length === 0,
        'no error toasts during the run' + (toasts.length ? ' (' + toasts.slice(-3).join(' | ').slice(0, 160) + ')' : ''));
  } catch (e) {
    say(false, 'threw: ' + (e && e.stack || e));
  }
  done();
})();
</script>
</body>
